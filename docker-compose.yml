services:

  mongodb:
    image: mongo:7.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo:/data/db:Z
    restart: always
    networks:
      - microservices
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=pass

volumes:
  mongo:

networks:
  microservices:
    driver: bridge