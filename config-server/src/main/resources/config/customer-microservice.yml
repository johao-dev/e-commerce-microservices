spring:
  data:
    mongodb:
      uri: mongodb://root:pass@localhost:27017/customer_db?authSource=admin

  output:
    ansi:
      enabled: ALWAYS

logging:
    level:
      root: INFO
      zuzz.projects.e-commerce.microservices: WARN
    pattern:
     console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %5level %logger{36} - %msg%n"
     file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %5level %logger{36} - %msg%n"
    file:
      name: logs/customer-microservice.log
      max-size: 10MB
      max-history: 30

server:
  port: 8091